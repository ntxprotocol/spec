name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The same checks as the local pre-commit and pre-push hooks.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage pre-commit
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage pre-push

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off (DCO) and follows Conventional Commits
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+'
          for sha in $(git rev-list "$RANGE"); do
            message=$(git log -1 --format=%B "$sha")
            if ! grep -q '^Signed-off-by: ' <<< "$message"; then
              echo "::error::$sha has no Signed-off-by line (use git commit -s)"; status=1
            fi
            if ! head -1 <<< "$message" | grep -Eq "$pattern"; then
              echo "::error::$sha subject is not a Conventional Commit: $(head -1 <<< "$message")"; status=1
            fi
          done
          exit $status
