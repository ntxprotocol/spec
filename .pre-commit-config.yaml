# Checks before commit and push. See https://github.com/ntxprotocol/.github/blob/main/CODE_STANDARDS.md
# Install once:  pre-commit install
# Run all:       pre-commit run --all-files --hook-stage pre-push
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
# Verbatim Community Specification documents must stay byte-for-byte unchanged.
exclude: ^community-specification/

repos:
  # Shared by every NTX repository: file hygiene, secrets, commit messages.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: dco-sign-off
        name: DCO sign-off (git commit -s)
        language: pygrep
        entry: '^Signed-off-by: .+ <.+@.+>'
        args: [--negate]
        stages: [commit-msg]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        language_version: system
  - repo: local
    hooks:
      - id: spec-checks
        name: schemas compile, examples pass/fail as expected
        language: system
        entry: npm test
        files: ^(schemas|examples|types|scripts)/
        pass_filenames: false
      - id: spec-checks-all
        name: all spec checks
        language: system
        entry: npm test
        pass_filenames: false
        always_run: true
        stages: [pre-push]
